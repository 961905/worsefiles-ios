name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Also create/update a GitHub Release with the ipa"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: xcodegen
        run: brew install xcodegen

      - name: toolchain
        run: xcodebuild -version

      - name: build
        shell: bash
        run: |
          set -o pipefail
          ./scripts/build.sh 2>&1 | tee build.log

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#refs/tags/}"
          elif [[ "${GITHUB_REF_NAME}" == "main" || "${{ inputs.release }}" == "true" ]]; then
            TAG="latest"
          else
            echo "no release requested"; exit 0
          fi
          gh release create "${TAG}" WorseFiles-unsigned.ipa \
            --title "worsefiles ${TAG}" \
            --notes "unsigned ipa from ${GITHUB_SHA::7}, sign before install" \
            --clobber || gh release upload "${TAG}" WorseFiles-unsigned.ipa --clobber
